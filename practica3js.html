<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .primario{
        background-color: cadetblue;
        }
            
        
    </style>
</head>
<body>
    
<button id="btn" >Saludar</button>

<div id="cajita" class="primario">Holaa pa</div>
<script>

let boton=document.getElementById("btn");

boton.addEventListener("click",saludar)

let cajita=document.getElementById("cajita");

cajita.addEventListener("mouseover",cambiarcolor)

    function saludar(){
        alert("saluditop wasaaaaaapヾ(≧▽≦*)")
    }

    function cambiarcolor(){
        document.getElementById("cajita").classList.toggle("primario")
    }
</script>

</body>
</html>
